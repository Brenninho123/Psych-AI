<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Psych AI - Offline</title>
<style>
body {
  margin: 0;
  height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #0a0a12;
  color: #f0f0f5;
  font-family: 'Segoe UI', system-ui, sans-serif;
  text-align: center;
  padding: 20px;
}

.box {
  max-width: 320px;
}

.logo-mark {
  width: 56px;
  height: 56px;
  border-radius: 16px;
  background: linear-gradient(135deg, #ff6bcb, #7c5cff);
  margin: 0 auto 20px;
}

h1 {
  font-size: 20px;
  margin-bottom: 8px;
}

p {
  color: #8888a0;
  font-size: 14px;
  line-height: 1.6;
}

button {
  margin-top: 20px;
  background: linear-gradient(135deg, #7c5cff, #ff6bcb);
  border: none;
  color: #100a1a;
  font-weight: 600;
  padding: 10px 20px;
  border-radius: 10px;
  cursor: pointer;
  font-size: 13px;
}
</style>
</head>
<body>
<div class="box">
  <div class="logo-mark"></div>
  <h1>You are offline</h1>
  <p>Psych AI needs a connection to respond. Your saved chats are still here once you reconnect.</p>
  <button onclick="location.reload()">Try again</button>
</div>
</body>
</html>
