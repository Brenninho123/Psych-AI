<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Psych AI</title>
<style>
:root {
  --bg: #0f0f14;
  --panel: #17171f;
  --panel-alt: #1f1f2b;
  --accent: #ff6bcb;
  --accent-dim: #7a3d63;
  --text: #eaeaf0;
  --text-dim: #9a9aab;
  --border: #2a2a38;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: 'Segoe UI', system-ui, sans-serif;
  background: var(--bg);
  color: var(--text);
  height: 100vh;
  display: flex;
  flex-direction: column;
}

header {
  padding: 16px 24px;
  background: var(--panel);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 12px;
}

header .logo {
  width: 32px;
  height: 32px;
  border-radius: 8px;
  background: linear-gradient(135deg, var(--accent), var(--accent-dim));
}

header h1 {
  font-size: 18px;
  font-weight: 600;
}

header p {
  font-size: 12px;
  color: var(--text-dim);
}

main {
  flex: 1;
  display: flex;
  flex-direction: column;
  max-width: 900px;
  width: 100%;
  margin: 0 auto;
  overflow: hidden;
}

#chat {
  flex: 1;
  overflow-y: auto;
  padding: 24px;
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.msg {
  max-width: 80%;
  padding: 12px 16px;
  border-radius: 14px;
  line-height: 1.5;
  font-size: 14px;
  white-space: pre-wrap;
  word-wrap: break-word;
}

.msg.user {
  align-self: flex-end;
  background: var(--accent);
  color: #1a0f16;
  border-bottom-right-radius: 4px;
}

.msg.ai {
  align-self: flex-start;
  background: var(--panel-alt);
  border: 1px solid var(--border);
  border-bottom-left-radius: 4px;
}

.msg.ai pre {
  background: #0d0d13;
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 12px;
  overflow-x: auto;
  margin-top: 8px;
  font-size: 13px;
}

#empty-state {
  margin: auto;
  text-align: center;
  color: var(--text-dim);
}

#empty-state h2 {
  color: var(--text);
  font-size: 20px;
  margin-bottom: 8px;
}

#input-area {
  padding: 16px 24px 24px;
  border-top: 1px solid var(--border);
  background: var(--panel);
}

#input-row {
  display: flex;
  gap: 10px;
  background: var(--panel-alt);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 8px 8px 8px 16px;
}

#input-row textarea {
  flex: 1;
  background: none;
  border: none;
  outline: none;
  resize: none;
  color: var(--text);
  font-family: inherit;
  font-size: 14px;
  max-height: 160px;
  padding: 8px 0;
}

#input-row textarea::placeholder {
  color: var(--text-dim);
}

#send-btn {
  align-self: flex-end;
  background: var(--accent);
  color: #1a0f16;
  border: none;
  border-radius: 8px;
  padding: 10px 16px;
  font-weight: 600;
  font-size: 13px;
  cursor: pointer;
  transition: opacity 0.15s;
}

#send-btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

#send-btn:hover:not(:disabled) {
  opacity: 0.85;
}

.typing {
  display: flex;
  gap: 4px;
  padding: 4px 0;
}

.typing span {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--text-dim);
  animation: bounce 1.2s infinite;
}

.typing span:nth-child(2) { animation-delay: 0.2s; }
.typing span:nth-child(3) { animation-delay: 0.4s; }

@keyframes bounce {
  0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
  30% { transform: translateY(-4px); opacity: 1; }
}
</style>
</head>
<body>

<header>
  <div class="logo"></div>
  <div>
    <h1>Psych AI</h1>
    <p>AI focused on Psych Engine</p>
  </div>
</header>

<main>
  <div id="chat">
    <div id="empty-state">
      <h2>Ask anything about Psych Engine</h2>
      <p>Scripts, HScript, mechanics, errors, whatever you need.</p>
    </div>
  </div>

  <div id="input-area">
    <div id="input-row">
      <textarea id="input" placeholder="Type your question..." rows="1"></textarea>
      <button id="send-btn">Send</button>
    </div>
  </div>
</main>

<script>
const API_URL = "";

const chat = document.getElementById("chat");
const input = document.getElementById("input");
const sendBtn = document.getElementById("send-btn");
const emptyState = document.getElementById("empty-state");

let history = [];

function autoResize() {
  input.style.height = "auto";
  input.style.height = Math.min(input.scrollHeight, 160) + "px";
}

input.addEventListener("input", autoResize);

input.addEventListener("keydown", function(e) {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});

sendBtn.addEventListener("click", sendMessage);

function escapeHtml(text) {
  const div = document.createElement("div");
  div.textContent = text;
  return div.innerHTML;
}

function formatMessage(text) {
  const escaped = escapeHtml(text);
  return escaped.replace(/```([\s\S]*?)```/g, function(match, code) {
    return "<pre><code>" + code.trim() + "</code></pre>";
  });
}

function addMessage(role, text) {
  if (emptyState) emptyState.remove();
  const el = document.createElement("div");
  el.className = "msg " + role;
  el.innerHTML = formatMessage(text);
  chat.appendChild(el);
  chat.scrollTop = chat.scrollHeight;
  return el;
}

function addTypingIndicator() {
  const el = document.createElement("div");
  el.className = "msg ai";
  el.id = "typing-indicator";
  el.innerHTML = '<div class="typing"><span></span><span></span><span></span></div>';
  chat.appendChild(el);
  chat.scrollTop = chat.scrollHeight;
}

function removeTypingIndicator() {
  const el = document.getElementById("typing-indicator");
  if (el) el.remove();
}

async function sendMessage() {
  const text = input.value.trim();
  if (!text) return;

  input.value = "";
  autoResize();
  sendBtn.disabled = true;

  addMessage("user", text);
  history.push({ role: "user", content: text });

  addTypingIndicator();

  try {
    const response = await fetch(API_URL + "/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ messages: history })
    });

    if (!response.ok) throw new Error("Request failed");

    const data = await response.json();
    removeTypingIndicator();
    addMessage("ai", data.reply);
    history.push({ role: "assistant", content: data.reply });
  } catch (err) {
    removeTypingIndicator();
    addMessage("ai", "Error connecting to the server. Try again later.");
  } finally {
    sendBtn.disabled = false;
    input.focus();
  }
}
</script>

</body>
</html>
